name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Native AOT on Linux needs clang + zlib; Windows/macOS runners ship the toolchain.
      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Build
        run: dotnet build DevToolsMcp.slnx -c Release

      - name: Test
        run: dotnet test --project tests/DevToolsMcp.Tests -c Release --no-build

      # Single-file, self-contained Native AOT executable. Trim/AOT warnings are build errors.
      - name: Publish
        run: dotnet publish src/DevToolsMcp.Server -c Release -r ${{ matrix.rid }} -o artifacts/publish/${{ matrix.rid }}

      - name: Smoke test
        shell: bash
        run: |
          bin=artifacts/publish/${{ matrix.rid }}/devtools-mcp
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" & pid=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:5180/health && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:5180/health
          # A second start must detect the running instance and exit cleanly (not crash on the taken port).
          DevToolsMcp__OpenBrowser=false "$bin"
          # --stdio answers MCP on stdout (logs on stderr) and keeps working while another instance holds the port.
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          { echo "$init"; sleep 3; } | DevToolsMcp__OpenBrowser=false "$bin" --stdio 2>/dev/null | grep -m1 '"serverInfo":{"name":"devtools-mcp"'
          kill $pid

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd artifacts/publish/${{ matrix.rid }}
          # Pick names by OS: Git Bash on Windows resolves "devtools-mcp" to the .exe, so probing files is unreliable.
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/dist/devtools-mcp-${{ matrix.rid }}.zip" devtools-mcp.exe appsettings.json
          else
            tar -czf "$GITHUB_WORKSPACE/dist/devtools-mcp-${{ matrix.rid }}.tar.gz" devtools-mcp appsettings.json
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: devtools-mcp-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # Every push to main (or a manual run on main) creates a pre-release with all binaries.
  # Pushing a v* tag creates a regular release instead.
  release:
    name: release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.${GITHUB_RUN_NUMBER}-preview" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: devtools-mcp ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
